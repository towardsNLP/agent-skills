<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 250" role="img" aria-labelledby="t">
<title id="t">The altitude of each section of a page, in reading order</title>
<style>
svg{--fz-fg:#17201f;--fz-card:#ffffff;--fz-muted:#5f6b6d;--fz-rule:#dfe4e3;--fz-exists:#5b6870;--fz-new:#0b6b66;--fz-changed:#97570a;--fz-out:#868c94;--fz-open:#a3352b;--fz-exists-fill:#f2f3f4;--fz-new-fill:#dfeceb;--fz-changed-fill:#f0e8dd}
@media (prefers-color-scheme: dark){svg{--fz-fg:#e4eaea;--fz-card:#161c1f;--fz-muted:#98a5a7;--fz-rule:#2a3437;--fz-exists:#a3b1b8;--fz-new:#5ccfc5;--fz-changed:#e7aa58;--fz-out:#7a818b;--fz-open:#f08f80;--fz-exists-fill:#21282b;--fz-new-fill:#1f3335;--fz-changed-fill:#333027}}
.bg{fill:var(--fz-card)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:var(--fz-fg)}
.t{font-size:13px;font-weight:650}.st{font-size:10px;fill:var(--fz-muted)}.ann{font-size:10.5px;fill:var(--fz-muted)}
.ey{font-size:10.5px;letter-spacing:.12em;fill:var(--fz-muted);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.halo{paint-order:stroke;stroke:var(--fz-card);stroke-width:5px;stroke-linejoin:round}
.bx-exists rect,rect.bx-exists{fill:var(--fz-exists-fill);stroke:var(--fz-exists);stroke-width:1.3}
.bx-new rect,rect.bx-new{fill:var(--fz-new-fill);stroke:var(--fz-new);stroke-width:1.7}
.bx-changed rect,rect.bx-changed{fill:var(--fz-changed-fill);stroke:var(--fz-changed);stroke-width:1.7}
.bx-later rect{fill:none;stroke:var(--fz-new);stroke-width:1.5;stroke-dasharray:3 3}
.bx-out rect{fill:none;stroke:var(--fz-out);stroke-width:1.2;stroke-dasharray:6 4}
.bx-open rect{fill:none;stroke:var(--fz-open);stroke-width:1.6}
.ar{stroke:var(--fz-muted);stroke-width:1.4;fill:none}.ar-new{stroke:var(--fz-new);stroke-width:1.6;fill:none}
.ahp{fill:var(--fz-muted)}.ahn{fill:var(--fz-new)}.brk{stroke:var(--fz-muted);stroke-width:1;fill:none}.dash{stroke-dasharray:5 4}
.doc{fill:var(--fz-new-fill);stroke:var(--fz-new);stroke-width:1.5}
.dot{fill:var(--fz-card);stroke:var(--fz-new);stroke-width:2.2}.dot.fk{stroke:var(--fz-open)}
.gl{stroke:var(--fz-rule);stroke-width:1;stroke-dasharray:3 5}.region{fill:none;stroke:var(--fz-exists);stroke-width:1.2;stroke-dasharray:5 4}
.wave{stroke:var(--fz-new);stroke-width:2.6;fill:none;stroke-linecap:round}
</style>
<rect class="bg" width="940" height="250" rx="10"/>
<text class="ey" x="8" y="16">▲ THE WHOLE, OVER TIME</text>
<text class="ey" x="8" y="244">▼ ONE DECISION</text>
<line class="gl" x1="40" y1="34" x2="920" y2="34"/>
<line class="gl" x1="40" y1="206" x2="920" y2="206"/>
<path class="wave" d="M60,120 C73,112 111,86 136,72 C162,58 187,26 213,34 C238,42 264,98 289,120 C315,142 340,176 365,168 C391,160 416,88 442,72 C467,56 493,64 518,72 C544,80 569,104 595,120 C620,136 645,154 671,168 C696,182 722,206 747,206 C773,206 798,182 824,168 C849,154 887,128 900,120"/>
<circle class="dot" cx="60" cy="120" r="5.5"/>
<text class="ann halo" x="60" y="107" text-anchor="middle" style="fill:var(--fz-fg)">Thesis</text>
<circle class="dot" cx="136" cy="72" r="5.5"/>
<text class="ann halo" x="136" y="59" text-anchor="middle" style="fill:var(--fz-fg)">Zoom out</text>
<circle class="dot" cx="213" cy="34" r="5.5"/>
<text class="ann halo" x="213" y="21" text-anchor="middle" style="fill:var(--fz-fg)">Trajectory</text>
<circle class="dot" cx="289" cy="120" r="5.5"/>
<text class="ann halo" x="289" y="107" text-anchor="middle" style="fill:var(--fz-fg)">Frame</text>
<circle class="dot" cx="365" cy="168" r="5.5"/>
<text class="ann halo" x="365" y="189" text-anchor="middle" style="fill:var(--fz-fg)">Shape</text>
<circle class="dot" cx="442" cy="72" r="5.5"/>
<text class="ann halo" x="442" y="59" text-anchor="middle" style="fill:var(--fz-fg)">Precedents</text>
<circle class="dot" cx="518" cy="72" r="5.5"/>
<text class="ann halo" x="518" y="59" text-anchor="middle" style="fill:var(--fz-fg)">Alternatives</text>
<circle class="dot" cx="595" cy="120" r="5.5"/>
<text class="ann halo" x="595" y="107" text-anchor="middle" style="fill:var(--fz-fg)">Where my view ends</text>
<circle class="dot" cx="671" cy="168" r="5.5"/>
<text class="ann halo" x="671" y="189" text-anchor="middle" style="fill:var(--fz-fg)">Assumptions</text>
<circle class="dot fk" cx="747" cy="206" r="6"/>
<text class="ann halo" x="747" y="227" text-anchor="middle" style="fill:var(--fz-open)">Forks</text>
<circle class="dot" cx="824" cy="168" r="5.5"/>
<text class="ann halo" x="824" y="189" text-anchor="middle" style="fill:var(--fz-fg)">Defaults</text>
<circle class="dot" cx="900" cy="120" r="5.5"/>
<text class="ann halo" x="900" y="107" text-anchor="middle" style="fill:var(--fz-fg)">Preview</text>
</svg>
