<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-labelledby="t">
<title id="t">Pattern: where a new part lands in a running loop (an invented order-fulfilment example)</title>
<style>
svg{--fz-fg:#17201f;--fz-card:#ffffff;--fz-muted:#5f6b6d;--fz-rule:#dfe4e3;--fz-exists:#5b6870;--fz-new:#0b6b66;--fz-changed:#97570a;--fz-out:#868c94;--fz-open:#a3352b;--fz-exists-fill:#f2f3f4;--fz-new-fill:#dfeceb;--fz-changed-fill:#f0e8dd}
@media (prefers-color-scheme: dark){svg{--fz-fg:#e4eaea;--fz-card:#161c1f;--fz-muted:#98a5a7;--fz-rule:#2a3437;--fz-exists:#a3b1b8;--fz-new:#5ccfc5;--fz-changed:#e7aa58;--fz-out:#7a818b;--fz-open:#f08f80;--fz-exists-fill:#21282b;--fz-new-fill:#1f3335;--fz-changed-fill:#333027}}
.bg{fill:var(--fz-card)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:var(--fz-fg)}
.t{font-size:13px;font-weight:650}.st{font-size:10px;fill:var(--fz-muted)}.ann{font-size:10.5px;fill:var(--fz-muted)}
.ey{font-size:10.5px;letter-spacing:.12em;fill:var(--fz-muted);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.halo{paint-order:stroke;stroke:var(--fz-card);stroke-width:5px;stroke-linejoin:round}
.bx-exists rect,rect.bx-exists{fill:var(--fz-exists-fill);stroke:var(--fz-exists);stroke-width:1.3}
.bx-new rect,rect.bx-new{fill:var(--fz-new-fill);stroke:var(--fz-new);stroke-width:1.7}
.bx-changed rect,rect.bx-changed{fill:var(--fz-changed-fill);stroke:var(--fz-changed);stroke-width:1.7}
.bx-later rect{fill:none;stroke:var(--fz-new);stroke-width:1.5;stroke-dasharray:3 3}
.bx-out rect{fill:none;stroke:var(--fz-out);stroke-width:1.2;stroke-dasharray:6 4}
.bx-open rect{fill:none;stroke:var(--fz-open);stroke-width:1.6}
.ar{stroke:var(--fz-muted);stroke-width:1.4;fill:none}.ar-new{stroke:var(--fz-new);stroke-width:1.6;fill:none}
.ahp{fill:var(--fz-muted)}.ahn{fill:var(--fz-new)}.brk{stroke:var(--fz-muted);stroke-width:1;fill:none}.dash{stroke-dasharray:5 4}
.doc{fill:var(--fz-new-fill);stroke:var(--fz-new);stroke-width:1.5}
.dot{fill:var(--fz-card);stroke:var(--fz-new);stroke-width:2.2}.dot.fk{stroke:var(--fz-open)}
.gl{stroke:var(--fz-rule);stroke-width:1;stroke-dasharray:3 5}.region{fill:none;stroke:var(--fz-exists);stroke-width:1.2;stroke-dasharray:5 4}
.wave{stroke:var(--fz-new);stroke-width:2.6;fill:none;stroke-linecap:round}
</style>
<rect class="bg" width="900" height="290" rx="10"/>
<defs>
<marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ahp" d="M0,0 L8,4 L0,8 z"/></marker>
<marker id="ahn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ahn" d="M0,0 L8,4 L0,8 z"/></marker>
</defs>
<text class="ey" x="10" y="20">ONE TURN OF THE SYSTEM (AN INVENTED ORDER-FULFILMENT LOOP)</text>
<g class="bx-changed"><rect x="10" y="34" width="110" height="50" rx="8"/></g><text class="t" x="65" y="57" text-anchor="middle" style="font-size:12.5px">receive order</text><text class="st" x="65" y="72" text-anchor="middle">+ two fields</text>
<g class="bx-exists"><rect x="134" y="34" width="110" height="50" rx="8"/></g><text class="t" x="189" y="57" text-anchor="middle" style="font-size:12.5px">check stock</text><text class="st" x="189" y="72" text-anchor="middle">per warehouse</text>
<path class="ar" d="M121,59 H132" marker-end="url(#ah)"/>
<g class="bx-exists"><rect x="258" y="34" width="110" height="50" rx="8"/></g><text class="t" x="313" y="57" text-anchor="middle" style="font-size:12.5px">price</text><text class="st" x="313" y="72" text-anchor="middle">rules apply</text>
<path class="ar" d="M245,59 H256" marker-end="url(#ah)"/>
<g class="bx-exists"><rect x="382" y="34" width="110" height="50" rx="8"/></g><text class="t" x="437" y="57" text-anchor="middle" style="font-size:12.5px">pick route</text><text class="st" x="437" y="72" text-anchor="middle">carrier chosen</text>
<path class="ar" d="M369,59 H380" marker-end="url(#ah)"/>
<g class="bx-exists"><rect x="506" y="34" width="110" height="50" rx="8"/></g><text class="t" x="561" y="57" text-anchor="middle" style="font-size:12.5px">verify</text><text class="st" x="561" y="72" text-anchor="middle">fraud checks</text>
<path class="ar" d="M493,59 H504" marker-end="url(#ah)"/>
<g class="bx-exists"><rect x="630" y="34" width="110" height="50" rx="8"/></g><text class="t" x="685" y="57" text-anchor="middle" style="font-size:12.5px">pack</text><text class="st" x="685" y="72" text-anchor="middle">slip printed</text>
<path class="ar" d="M617,59 H628" marker-end="url(#ah)"/>
<g class="bx-exists"><rect x="754" y="34" width="110" height="50" rx="8"/></g><text class="t" x="809" y="57" text-anchor="middle" style="font-size:12.5px">ship</text><text class="st" x="809" y="72" text-anchor="middle">customer told</text>
<path class="ar" d="M741,59 H752" marker-end="url(#ah)"/>
<g class="bx-new"><rect x="120" y="130" width="140" height="46" rx="8"/></g><text class="t" x="190" y="151" text-anchor="middle" style="font-size:12px">a product taxonomy</text><text class="st" x="190" y="166" text-anchor="middle">mapped to what exists</text>
<path class="ar-new" d="M190,129 V86" style="stroke-width:1.2"/>
<g class="bx-new"><rect x="596" y="130" width="130" height="46" rx="8"/></g><text class="t" x="661" y="151" text-anchor="middle" style="font-size:12px">a gift note</text><text class="st" x="661" y="166" text-anchor="middle">only when asked for</text>
<path class="ar-new" d="M685,129 V86" style="stroke-width:1.2"/>
<g class="bx-new"><rect x="740" y="130" width="150" height="46" rx="8"/></g><text class="t" x="815" y="151" text-anchor="middle" style="font-size:12px">a tracking line</text><text class="st" x="815" y="166" text-anchor="middle">read-only, in the message</text>
<path class="ar-new" d="M809,129 V86" style="stroke-width:1.2"/>
<g class="bx-new"><rect x="10" y="196" width="210" height="46" rx="8"/></g><text class="t" x="115" y="217" text-anchor="middle" style="font-size:12px">supplier conflicts</text><text class="st" x="115" y="232" text-anchor="middle">a record for the owner, no runtime effect</text>
<g class="bx-out"><rect x="250" y="196" width="170" height="46" rx="8"/></g><text class="t" x="335" y="217" text-anchor="middle" style="font-size:12px">pricing changes</text><text class="st" x="335" y="232" text-anchor="middle">none: pricing untouched</text>
<path class="ar dash" d="M313,195 V86" style="stroke-width:1.1"/>
<g class="bx-open"><rect x="444" y="196" width="180" height="46" rx="8"/></g><text class="t" x="534" y="217" text-anchor="middle" style="font-size:12px">suggesting a reorder</text><text class="st" x="534" y="232" text-anchor="middle">open: needs the owner</text>
<path class="dash" d="M470,195 L437,86" style="stroke:var(--fz-open);stroke-width:1.2;fill:none"/>
<text class="st" x="10" y="276">Grey: the system as built. Ochre: changed. Teal: what the new part adds. Dashed: left out on purpose. Coral: open.</text>
</svg>
