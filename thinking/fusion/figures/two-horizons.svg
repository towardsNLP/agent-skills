<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t">
<title id="t">Two horizons overlap; the page is drawn in the overlap</title>
<style>
svg{--fz-fg:#17201f;--fz-card:#ffffff;--fz-muted:#5f6b6d;--fz-rule:#dfe4e3;--fz-exists:#5b6870;--fz-new:#0b6b66;--fz-changed:#97570a;--fz-out:#868c94;--fz-open:#a3352b;--fz-exists-fill:#f2f3f4;--fz-new-fill:#dfeceb;--fz-changed-fill:#f0e8dd}
@media (prefers-color-scheme: dark){svg{--fz-fg:#e4eaea;--fz-card:#161c1f;--fz-muted:#98a5a7;--fz-rule:#2a3437;--fz-exists:#a3b1b8;--fz-new:#5ccfc5;--fz-changed:#e7aa58;--fz-out:#7a818b;--fz-open:#f08f80;--fz-exists-fill:#21282b;--fz-new-fill:#1f3335;--fz-changed-fill:#333027}}
.bg{fill:var(--fz-card)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:var(--fz-fg)}
.t{font-size:13px;font-weight:650}.st{font-size:10px;fill:var(--fz-muted)}.ann{font-size:10.5px;fill:var(--fz-muted)}
.ey{font-size:10.5px;letter-spacing:.12em;fill:var(--fz-muted);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.halo{paint-order:stroke;stroke:var(--fz-card);stroke-width:5px;stroke-linejoin:round}
.bx-exists rect,rect.bx-exists{fill:var(--fz-exists-fill);stroke:var(--fz-exists);stroke-width:1.3}
.bx-new rect,rect.bx-new{fill:var(--fz-new-fill);stroke:var(--fz-new);stroke-width:1.7}
.bx-changed rect,rect.bx-changed{fill:var(--fz-changed-fill);stroke:var(--fz-changed);stroke-width:1.7}
.bx-later rect{fill:none;stroke:var(--fz-new);stroke-width:1.5;stroke-dasharray:3 3}
.bx-out rect{fill:none;stroke:var(--fz-out);stroke-width:1.2;stroke-dasharray:6 4}
.bx-open rect{fill:none;stroke:var(--fz-open);stroke-width:1.6}
.ar{stroke:var(--fz-muted);stroke-width:1.4;fill:none}.ar-new{stroke:var(--fz-new);stroke-width:1.6;fill:none}
.ahp{fill:var(--fz-muted)}.ahn{fill:var(--fz-new)}.brk{stroke:var(--fz-muted);stroke-width:1;fill:none}.dash{stroke-dasharray:5 4}
.doc{fill:var(--fz-new-fill);stroke:var(--fz-new);stroke-width:1.5}
.dot{fill:var(--fz-card);stroke:var(--fz-new);stroke-width:2.2}.dot.fk{stroke:var(--fz-open)}
.gl{stroke:var(--fz-rule);stroke-width:1;stroke-dasharray:3 5}.region{fill:none;stroke:var(--fz-exists);stroke-width:1.2;stroke-dasharray:5 4}
.wave{stroke:var(--fz-new);stroke-width:2.6;fill:none;stroke-linecap:round}
</style>
<rect class="bg" width="900" height="300" rx="10"/>
<defs><clipPath id="hz-left"><ellipse cx="350" cy="140" rx="260" ry="118"/></clipPath></defs>
  <ellipse cx="350" cy="140" rx="260" ry="118" style="fill:var(--fz-exists-fill);stroke:var(--fz-exists);stroke-width:1.4"/>
  <ellipse cx="550" cy="140" rx="260" ry="118" style="fill:var(--fz-exists-fill);stroke:var(--fz-exists);stroke-width:1.4"/>
  <ellipse cx="550" cy="140" rx="260" ry="118" clip-path="url(#hz-left)" style="fill:var(--fz-new-fill);stroke:var(--fz-new);stroke-width:1.7"/>
  <ellipse cx="350" cy="140" rx="260" ry="118" style="fill:none;stroke:var(--fz-exists);stroke-width:1.4"/>
  <text class="t" x="205" y="98" text-anchor="middle" style="font-size:12.5px">The agent's horizon</text>
  <text class="st" x="205" y="117" text-anchor="middle">the code, the documents,</text>
  <text class="st" x="205" y="131" text-anchor="middle">precedents on the web</text>
  <text class="st" x="205" y="176" text-anchor="middle">on the page as: grounding,</text>
  <text class="st" x="205" y="190" text-anchor="middle">anchors, precedents</text>
  <text class="t" x="695" y="98" text-anchor="middle" style="font-size:12.5px">The user's horizon</text>
  <text class="st" x="695" y="117" text-anchor="middle">the product, the people,</text>
  <text class="st" x="695" y="131" text-anchor="middle">the history, the intent</text>
  <text class="st" x="695" y="176" text-anchor="middle" style="fill:var(--fz-open)">on the page as: where my view</text>
  <text class="st" x="695" y="190" text-anchor="middle" style="fill:var(--fz-open)">ends, and the forks they rule</text>
  <text class="t" x="450" y="122" text-anchor="middle" style="font-size:13px;fill:var(--fz-new)">The page</text>
  <text class="st" x="450" y="141" text-anchor="middle">the frame, the figures,</text>
  <text class="st" x="450" y="155" text-anchor="middle">the forks and their stakes</text>
  <text class="st" x="450" y="178" text-anchor="middle" style="fill:var(--fz-new)">the plan comes out of here</text>
  <text class="st" x="450" y="286" text-anchor="middle">Neither view is erased, and neither is copied. A review adds a third horizon: the author's, recorded in the page and the spec.</text>
</svg>
