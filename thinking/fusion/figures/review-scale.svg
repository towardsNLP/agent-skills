<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t">
<title id="t">Review reads a spec at any of four stages and hands its rulings back</title>
<style>
svg{--fz-fg:#17201f;--fz-card:#ffffff;--fz-muted:#5f6b6d;--fz-rule:#dfe4e3;--fz-exists:#5b6870;--fz-new:#0b6b66;--fz-changed:#97570a;--fz-out:#868c94;--fz-open:#a3352b;--fz-exists-fill:#f2f3f4;--fz-new-fill:#dfeceb;--fz-changed-fill:#f0e8dd}
@media (prefers-color-scheme: dark){svg{--fz-fg:#e4eaea;--fz-card:#161c1f;--fz-muted:#98a5a7;--fz-rule:#2a3437;--fz-exists:#a3b1b8;--fz-new:#5ccfc5;--fz-changed:#e7aa58;--fz-out:#7a818b;--fz-open:#f08f80;--fz-exists-fill:#21282b;--fz-new-fill:#1f3335;--fz-changed-fill:#333027}}
.bg{fill:var(--fz-card)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:var(--fz-fg)}
.t{font-size:13px;font-weight:650}.st{font-size:10px;fill:var(--fz-muted)}.ann{font-size:10.5px;fill:var(--fz-muted)}
.ey{font-size:10.5px;letter-spacing:.12em;fill:var(--fz-muted);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.halo{paint-order:stroke;stroke:var(--fz-card);stroke-width:5px;stroke-linejoin:round}
.bx-exists rect,rect.bx-exists{fill:var(--fz-exists-fill);stroke:var(--fz-exists);stroke-width:1.3}
.bx-new rect,rect.bx-new{fill:var(--fz-new-fill);stroke:var(--fz-new);stroke-width:1.7}
.bx-changed rect,rect.bx-changed{fill:var(--fz-changed-fill);stroke:var(--fz-changed);stroke-width:1.7}
.bx-later rect{fill:none;stroke:var(--fz-new);stroke-width:1.5;stroke-dasharray:3 3}
.bx-out rect{fill:none;stroke:var(--fz-out);stroke-width:1.2;stroke-dasharray:6 4}
.bx-open rect{fill:none;stroke:var(--fz-open);stroke-width:1.6}
.ar{stroke:var(--fz-muted);stroke-width:1.4;fill:none}.ar-new{stroke:var(--fz-new);stroke-width:1.6;fill:none}
.ahp{fill:var(--fz-muted)}.ahn{fill:var(--fz-new)}.brk{stroke:var(--fz-muted);stroke-width:1;fill:none}.dash{stroke-dasharray:5 4}
.doc{fill:var(--fz-new-fill);stroke:var(--fz-new);stroke-width:1.5}
.dot{fill:var(--fz-card);stroke:var(--fz-new);stroke-width:2.2}.dot.fk{stroke:var(--fz-open)}
.gl{stroke:var(--fz-rule);stroke-width:1;stroke-dasharray:3 5}.region{fill:none;stroke:var(--fz-exists);stroke-width:1.2;stroke-dasharray:5 4}
.wave{stroke:var(--fz-new);stroke-width:2.6;fill:none;stroke-linecap:round}
</style>
<rect class="bg" width="900" height="300" rx="10"/>
<defs><marker id="ah-r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ahp" d="M0,0 L8,4 L0,8 z"/></marker>
      <marker id="ah-rn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path style="fill:var(--fz-new)" d="M0,0 L8,4 L0,8 z"/></marker></defs>
      <g class="bx-new"><rect x="300" y="10" width="360" height="52" rx="8"/></g>
      <text class="t" x="480" y="32" text-anchor="middle" style="font-size:12.5px">/fusion review</text>
      <text class="st" x="480" y="49" text-anchor="middle">any stage · your spec, a teammate's, or one for an outside expert</text>
      <text class="st" x="292" y="32" text-anchor="end" style="fill:var(--fz-new)">accept: kept on the review page,</text><text class="st" x="292" y="46" text-anchor="end" style="fill:var(--fz-new)">with reason and revisit condition</text>
      <path class="ar" style="stroke:var(--fz-new)" d="M270,90 H795"/>
      <path class="ar" style="stroke:var(--fz-new)" d="M480,90 V65" marker-end="url(#ah-rn)"/>
      <path class="ar" style="stroke:var(--fz-new)" d="M270,128 V90"/><text class="st" x="276" y="114" style="fill:var(--fz-new)">drafted or approved</text>
      <path class="ar" style="stroke:var(--fz-new)" d="M445,128 V90"/><text class="st" x="451" y="114" style="fill:var(--fz-new)">tickets cut</text>
      <path class="ar" style="stroke:var(--fz-new)" d="M620,128 V90"/><text class="st" x="626" y="114" style="fill:var(--fz-new)">part-built</text>
      <path class="ar" style="stroke:var(--fz-new)" d="M795,128 V90"/><text class="st" x="801" y="114" style="fill:var(--fz-new)">built</text>
      <g class="bx-changed"><rect x="20" y="130" width="150" height="50" rx="8"/></g><text class="t" x="95" y="151" text-anchor="middle" style="font-size:12px">/fusion</text><text class="st" x="95" y="167" text-anchor="middle">plan</text>
      <g class="bx-changed"><rect x="195" y="130" width="150" height="50" rx="8"/></g><text class="t" x="270" y="151" text-anchor="middle" style="font-size:12px">/adr-spec</text><text class="st" x="270" y="167" text-anchor="middle">write the spec</text>
      <g class="bx-exists"><rect x="370" y="130" width="150" height="50" rx="8"/></g><text class="t" x="445" y="151" text-anchor="middle" style="font-size:12px">/tickets</text><text class="st" x="445" y="167" text-anchor="middle">cut</text>
      <g class="bx-exists"><rect x="545" y="130" width="150" height="50" rx="8"/></g><text class="t" x="620" y="151" text-anchor="middle" style="font-size:12px">/implement</text><text class="st" x="620" y="167" text-anchor="middle">build</text>
      <g class="bx-exists"><rect x="720" y="130" width="150" height="50" rx="8"/></g><text class="t" x="795" y="151" text-anchor="middle" style="font-size:12px">/implement's close</text><text class="st" x="795" y="167" text-anchor="middle">acceptance record</text>
      <path class="ar" d="M171,155 H192" marker-end="url(#ah-r)"/><path class="ar" d="M346,155 H367" marker-end="url(#ah-r)"/><path class="ar" d="M521,155 H542" marker-end="url(#ah-r)"/><path class="ar" d="M696,155 H717" marker-end="url(#ah-r)"/>
      <path class="ar" style="stroke:var(--fz-new);stroke-width:1.7" d="M662,36 H884 V246 H95"/>
      <path class="ar" style="stroke:var(--fz-new);stroke-width:1.7" d="M95,246 V184" marker-end="url(#ah-rn)"/>
      <path class="ar" style="stroke:var(--fz-new);stroke-width:1.7" d="M270,246 V184" marker-end="url(#ah-rn)"/>
      <path class="ar" style="stroke:var(--fz-new);stroke-width:1.7" d="M445,246 V184" marker-end="url(#ah-rn)"/>
      <text class="st" x="95" y="264" text-anchor="middle" style="fill:var(--fz-new)">re-plan: a new fusion page</text>
      <text class="st" x="270" y="264" text-anchor="middle" style="fill:var(--fz-new)">amend, or revise a draft</text>
      <text class="st" x="445" y="264" text-anchor="middle" style="fill:var(--fz-new)">recut or add tickets</text>
      <text class="st" x="10" y="292">Grey: unchanged. Ochre: changed by this plan. Teal: the review scale, reading the pipeline above and handing back below.</text>
</svg>
