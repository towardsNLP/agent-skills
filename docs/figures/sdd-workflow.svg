<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t">
<title id="t">The spec-driven workflow by size of work, with the points where you approve and the review loop</title>
<style>
svg{--fz-fg:#17201f;--fz-card:#ffffff;--fz-muted:#5f6b6d;--fz-rule:#dfe4e3;--fz-exists:#5b6870;--fz-new:#0b6b66;--fz-changed:#97570a;--fz-out:#868c94;--fz-open:#a3352b;--fz-exists-fill:#f2f3f4;--fz-new-fill:#dfeceb;--fz-changed-fill:#f0e8dd}
@media (prefers-color-scheme: dark){svg{--fz-fg:#e4eaea;--fz-card:#161c1f;--fz-muted:#98a5a7;--fz-rule:#2a3437;--fz-exists:#a3b1b8;--fz-new:#5ccfc5;--fz-changed:#e7aa58;--fz-out:#7a818b;--fz-open:#f08f80;--fz-exists-fill:#21282b;--fz-new-fill:#1f3335;--fz-changed-fill:#333027}}
.bg{fill:var(--fz-card)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:var(--fz-fg)}
.t{font-size:13px;font-weight:650}.st{font-size:10px;fill:var(--fz-muted)}.ann{font-size:10.5px;fill:var(--fz-muted)}
.ey{font-size:10.5px;letter-spacing:.12em;fill:var(--fz-muted);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.halo{paint-order:stroke;stroke:var(--fz-card);stroke-width:5px;stroke-linejoin:round}
.bx-exists rect,rect.bx-exists{fill:var(--fz-exists-fill);stroke:var(--fz-exists);stroke-width:1.3}
.bx-new rect,rect.bx-new{fill:var(--fz-new-fill);stroke:var(--fz-new);stroke-width:1.7}
.bx-changed rect,rect.bx-changed{fill:var(--fz-changed-fill);stroke:var(--fz-changed);stroke-width:1.7}
.bx-later rect{fill:none;stroke:var(--fz-new);stroke-width:1.5;stroke-dasharray:3 3}
.bx-out rect{fill:none;stroke:var(--fz-out);stroke-width:1.2;stroke-dasharray:6 4}
.bx-open rect{fill:none;stroke:var(--fz-open);stroke-width:1.6}
.ar{stroke:var(--fz-muted);stroke-width:1.4;fill:none}.ar-new{stroke:var(--fz-new);stroke-width:1.6;fill:none}
.ahp{fill:var(--fz-muted)}.ahn{fill:var(--fz-new)}.brk{stroke:var(--fz-muted);stroke-width:1;fill:none}.dash{stroke-dasharray:5 4}
.doc{fill:var(--fz-new-fill);stroke:var(--fz-new);stroke-width:1.5}
.dot{fill:var(--fz-card);stroke:var(--fz-new);stroke-width:2.2}.dot.fk{stroke:var(--fz-open)}
.gl{stroke:var(--fz-rule);stroke-width:1;stroke-dasharray:3 5}.region{fill:none;stroke:var(--fz-exists);stroke-width:1.2;stroke-dasharray:5 4}
.wave{stroke:var(--fz-new);stroke-width:2.6;fill:none;stroke-linecap:round}
</style>
<rect class="bg" width="1000" height="500" rx="10"/>
<defs>
    <marker id="fa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ahp" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="fn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ahn" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <text class="ey" x="10" y="20">HOW BIG IS THE WORK?</text>

  <!-- lane labels -->
  <text class="t" x="10" y="64" style="font-size:12.5px">A project</text>
  <text class="st" x="10" y="80">many specs</text>
  <text class="t" x="10" y="198" style="font-size:12.5px">One component</text>
  <text class="st" x="10" y="214">one spec, one row</text>
  <text class="st" x="10" y="227">of the spec map</text>
  <text class="t" x="10" y="388" style="font-size:12.5px">A small change</text>
  <text class="st" x="10" y="404">no scope change</text>

  <!-- project lane -->
  <g class="bx-new"><rect x="130" y="40" width="150" height="56" rx="8"/></g>
  <text class="t" x="205" y="63" text-anchor="middle" style="font-size:12.5px">/fusion</text>
  <text class="st" x="205" y="80" text-anchor="middle">a project page</text>
  <path class="ar" d="M281,68 H318" marker-end="url(#fa)"/>
  <g class="bx-exists"><rect x="320" y="40" width="150" height="56" rx="8"/></g>
  <text class="t" x="395" y="63" text-anchor="middle" style="font-size:12.5px">/deconstruct</text>
  <text class="st" x="395" y="80" text-anchor="middle">writes the spec map</text>
  <!-- each row of the map enters the component lane at its start -->
  <path class="ar" d="M395,97 V128 H205 V166" marker-end="url(#fa)"/>
  <text class="st" x="300" y="122" text-anchor="middle">then, for each row of the map</text>

  <!-- component lane -->
  <g class="bx-exists"><rect x="130" y="170" width="150" height="62" rx="8"/></g>
  <text class="t" x="205" y="192" text-anchor="middle" style="font-size:12.5px">grill-me or /fusion</text>
  <text class="st" x="205" y="208" text-anchor="middle">questions, or a page</text>
  <text class="st" x="205" y="222" text-anchor="middle">settles the decisions</text>
  <path class="ar" d="M281,201 H318" marker-end="url(#fa)"/>
  <g class="bx-exists"><rect x="320" y="170" width="150" height="62" rx="8"/></g>
  <text class="t" x="395" y="192" text-anchor="middle" style="font-size:12.5px">/adr-spec</text>
  <text class="st" x="395" y="208" text-anchor="middle">decisions, then the spec</text>
  <text class="st" x="395" y="222" text-anchor="middle">ADRs · spec.md</text>
  <path class="ar" d="M471,201 H508" marker-end="url(#fa)"/>
  <g class="bx-exists"><rect x="510" y="170" width="150" height="62" rx="8"/></g>
  <text class="t" x="585" y="192" text-anchor="middle" style="font-size:12.5px">/tickets</text>
  <text class="st" x="585" y="208" text-anchor="middle">each with its check</text>
  <text class="st" x="585" y="222" text-anchor="middle">tickets/&lt;id&gt;/NN.md</text>
  <path class="ar" d="M661,201 H698" marker-end="url(#fa)"/>
  <g class="bx-exists"><rect x="700" y="170" width="150" height="62" rx="8"/></g>
  <text class="t" x="775" y="192" text-anchor="middle" style="font-size:12.5px">/implement</text>
  <text class="st" x="775" y="208" text-anchor="middle">one ticket per fresh session</text>
  <text class="st" x="775" y="222" text-anchor="middle">Outcome · acceptance.md</text>
  <path class="ar" d="M851,201 H878" marker-end="url(#fa)"/>
  <g class="bx-out"><rect x="880" y="170" width="110" height="62" rx="8"/></g>
  <text class="t" x="935" y="195" text-anchor="middle" style="font-size:12px;fill:var(--fz-muted)">code review</text>
  <text class="st" x="935" y="211" text-anchor="middle">your host's,</text>
  <text class="st" x="935" y="224" text-anchor="middle">then merge</text>

  <!-- where you approve -->
  <g style="fill:var(--fz-card);stroke:var(--fz-open);stroke-width:1.6">
    <path d="M300,61 l7,7 -7,7 -7,-7 z"/>
    <path d="M395,105 l7,7 -7,7 -7,-7 z"/>
    <path d="M300,194 l7,7 -7,7 -7,-7 z"/>
    <path d="M490,194 l7,7 -7,7 -7,-7 z"/>
    <path d="M680,194 l7,7 -7,7 -7,-7 z"/>
  </g>
  <text class="st" x="300" y="34" text-anchor="middle" style="fill:var(--fz-open)">rule its forks</text>
  <text class="st" x="410" y="114" style="fill:var(--fz-open)">approve the map</text>
  <text class="st" x="300" y="162" text-anchor="middle" style="fill:var(--fz-open)">rule forks</text>
  <text class="st" x="490" y="162" text-anchor="middle" style="fill:var(--fz-open)">rule each ADR, approve the spec</text>
  <text class="st" x="690" y="162" text-anchor="middle" style="fill:var(--fz-open)">approve the list</text>

  <!-- the review loop: down from the build, then back up into what it can change -->
  <path class="ar-new" d="M775,233 V276" marker-end="url(#fn)"/>
  <text class="st" x="783" y="258" style="fill:var(--fz-new)">reads the spec and what was built</text>
  <g class="bx-new"><rect x="700" y="280" width="290" height="50" rx="8"/></g>
  <text class="t" x="845" y="301" text-anchor="middle" style="font-size:12.5px">/fusion review</text>
  <text class="st" x="845" y="318" text-anchor="middle">any stage after /adr-spec; the owner rules</text>
  <path class="ar-new" d="M699,305 H205 V236" marker-end="url(#fn)"/>
  <path class="ar-new" d="M395,305 V236" marker-end="url(#fn)"/>
  <path class="ar-new" d="M585,305 V236" marker-end="url(#fn)"/>
  <text class="st" x="213" y="268" style="fill:var(--fz-new)">re-plan</text>
  <text class="st" x="403" y="268" style="fill:var(--fz-new)">amend</text>
  <text class="st" x="593" y="268" style="fill:var(--fz-new)">recut or add</text>

  <!-- small change lane -->
  <g class="bx-exists"><rect x="130" y="362" width="150" height="56" rx="8"/></g>
  <text class="t" x="205" y="385" text-anchor="middle" style="font-size:12.5px">no spec</text>
  <text class="st" x="205" y="402" text-anchor="middle">work it test-first</text>
  <path class="ar" d="M281,390 H318" marker-end="url(#fa)"/>
  <g class="bx-exists"><rect x="320" y="362" width="150" height="56" rx="8"/></g>
  <text class="t" x="395" y="385" text-anchor="middle" style="font-size:12.5px">/tdd</text>
  <text class="st" x="395" y="402" text-anchor="middle">red, green, refactor</text>
  <path class="ar" d="M471,390 H508" marker-end="url(#fa)"/>
  <g class="bx-out"><rect x="510" y="362" width="150" height="56" rx="8"/></g>
  <text class="t" x="585" y="385" text-anchor="middle" style="font-size:12px;fill:var(--fz-muted)">code review</text>
  <text class="st" x="585" y="402" text-anchor="middle">done when tests pass</text>

  <!-- every session -->
  <path class="brk" d="M130,432 V438 H990 V432"/>
  <text class="st" x="560" y="454" text-anchor="middle">every working session: /start-session at the start, /end-session at the end (a lead also runs /sync-progress)</text>

  <text class="st" x="10" y="480">Grey: the pipeline. Teal: /fusion, as a project page and as the review loop. Dashed: outside this repo. Coral: where you approve.</text>
  <text class="st" x="10" y="494">Done is derived: tools/ticket_status.py runs each ticket's check.</text>
</svg>
