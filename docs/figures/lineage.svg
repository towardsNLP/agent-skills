<text class="t" x="550" y="54" text-anchor="middle" style="font-size:12.5px">from mattpocock/skills</text>
<text class="st" x="550" y="72" text-anchor="middle">vendored or adapted: grilling, grill-me, tdd, domain-modeling, research …</text>
<text class="st" x="550" y="88" text-anchor="middle">merged, then diverged: adr-spec, tickets, implement</text>
<g class="bx-changed"><rect x="340" y="120" width="420" height="52" rx="8"/></g><text class="t" x="550" y="144" text-anchor="middle" style="font-size:12.5px">from pstack</text><text class="st" x="550" y="159" text-anchor="middle">unslop · show-me-your-work · start-session's two principles</text>
