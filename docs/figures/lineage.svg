<g class="bx-new"><rect x="560" y="190" width="200" height="52" rx="8"/></g><text class="t" x="660" y="214" text-anchor="middle" style="font-size:12.5px">written here</text><text class="st" x="660" y="229" text-anchor="middle">the four session skills</text>
<g class="bx-new"><rect x="340" y="260" width="420" height="52" rx="8"/></g><text class="t" x="550" y="284" text-anchor="middle" style="font-size:13px">/fusion, written here</text><text class="st" x="550" y="299" text-anchor="middle">a page you think with, before a spec and after it</text>
<path class="ar" d="M271,155 C305,155 305,68 337,68" marker-end="url(#ah)"/>
