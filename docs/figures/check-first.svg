<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t">
<title id="t">One move at five altitudes: commit to the check before doing the work</title>
<style>
svg{--fz-fg:#17201f;--fz-card:#ffffff;--fz-muted:#5f6b6d;--fz-rule:#dfe4e3;--fz-exists:#5b6870;--fz-new:#0b6b66;--fz-changed:#97570a;--fz-out:#868c94;--fz-open:#a3352b;--fz-exists-fill:#f2f3f4;--fz-new-fill:#dfeceb;--fz-changed-fill:#f0e8dd}
@media (prefers-color-scheme: dark){svg{--fz-fg:#e4eaea;--fz-card:#161c1f;--fz-muted:#98a5a7;--fz-rule:#2a3437;--fz-exists:#a3b1b8;--fz-new:#5ccfc5;--fz-changed:#e7aa58;--fz-out:#7a818b;--fz-open:#f08f80;--fz-exists-fill:#21282b;--fz-new-fill:#1f3335;--fz-changed-fill:#333027}}
.bg{fill:var(--fz-card)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:var(--fz-fg)}
.t{font-size:13px;font-weight:650}.st{font-size:10px;fill:var(--fz-muted)}.ann{font-size:10.5px;fill:var(--fz-muted)}
.ey{font-size:10.5px;letter-spacing:.12em;fill:var(--fz-muted);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.halo{paint-order:stroke;stroke:var(--fz-card);stroke-width:5px;stroke-linejoin:round}
.bx-exists rect,rect.bx-exists{fill:var(--fz-exists-fill);stroke:var(--fz-exists);stroke-width:1.3}
.bx-new rect,rect.bx-new{fill:var(--fz-new-fill);stroke:var(--fz-new);stroke-width:1.7}
.bx-changed rect,rect.bx-changed{fill:var(--fz-changed-fill);stroke:var(--fz-changed);stroke-width:1.7}
.bx-later rect{fill:none;stroke:var(--fz-new);stroke-width:1.5;stroke-dasharray:3 3}
.bx-out rect{fill:none;stroke:var(--fz-out);stroke-width:1.2;stroke-dasharray:6 4}
.bx-open rect{fill:none;stroke:var(--fz-open);stroke-width:1.6}
.ar{stroke:var(--fz-muted);stroke-width:1.4;fill:none}.ar-new{stroke:var(--fz-new);stroke-width:1.6;fill:none}
.ahp{fill:var(--fz-muted)}.ahn{fill:var(--fz-new)}.brk{stroke:var(--fz-muted);stroke-width:1;fill:none}.dash{stroke-dasharray:5 4}
.doc{fill:var(--fz-new-fill);stroke:var(--fz-new);stroke-width:1.5}
.dot{fill:var(--fz-card);stroke:var(--fz-new);stroke-width:2.2}.dot.fk{stroke:var(--fz-open)}
.gl{stroke:var(--fz-rule);stroke-width:1;stroke-dasharray:3 5}.region{fill:none;stroke:var(--fz-exists);stroke-width:1.2;stroke-dasharray:5 4}
.wave{stroke:var(--fz-new);stroke-width:2.6;fill:none;stroke-linecap:round}
</style>
<rect class="bg" width="900" height="400" rx="10"/>
<defs>
<marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ahp" d="M0,0 L8,4 L0,8 z"/></marker>
<marker id="ahn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ahn" d="M0,0 L8,4 L0,8 z"/></marker>
</defs>
<text class="ey" x="20" y="22">COMMIT TO THE CHECK BEFORE DOING THE WORK</text>
<text class="ey" x="20" y="48">ALTITUDE</text><text class="ey" x="250" y="48">THE CHECK, COMMITTED FIRST</text><text class="ey" x="740" y="48">SKILL</text>
<g class="bx-exists"><rect x="20" y="60" width="210" height="50" rx="8"/></g><text class="t" x="125" y="83" text-anchor="middle" style="font-size:12.5px">Vocabulary</text><text class="st" x="125" y="98" text-anchor="middle">domain-driven design</text>
<g class="bx-new"><rect x="250" y="60" width="470" height="50" rx="8"/></g><text class="st" x="266" y="90" style="fill:var(--fz-fg);font-size:11.5px">a term's definition: what makes it true, and what does not</text>
<text class="t" x="740" y="90" style="font-size:12px">domain-modeling</text>
<g class="bx-exists"><rect x="20" y="122" width="210" height="50" rx="8"/></g><text class="t" x="125" y="145" text-anchor="middle" style="font-size:12.5px">Project</text><text class="st" x="125" y="160" text-anchor="middle">deconstruction</text>
<g class="bx-new"><rect x="250" y="122" width="470" height="50" rx="8"/></g><text class="st" x="266" y="152" style="fill:var(--fz-fg);font-size:11.5px">each component's boundary and the edges between components</text>
<text class="t" x="740" y="152" style="font-size:12px">/deconstruct</text>
<path class="ar" d="M125,111 V120" marker-end="url(#ah)"/>
<g class="bx-exists"><rect x="20" y="184" width="210" height="50" rx="8"/></g><text class="t" x="125" y="207" text-anchor="middle" style="font-size:12.5px">Feature</text><text class="st" x="125" y="222" text-anchor="middle">spec-driven development</text>
<g class="bx-new"><rect x="250" y="184" width="470" height="50" rx="8"/></g><text class="st" x="266" y="214" style="fill:var(--fz-fg);font-size:11.5px">the spec's acceptance criteria, attached to named seams</text>
<text class="t" x="740" y="214" style="font-size:12px">/adr-spec · /tickets</text>
<path class="ar" d="M125,173 V182" marker-end="url(#ah)"/>
<g class="bx-exists"><rect x="20" y="246" width="210" height="50" rx="8"/></g><text class="t" x="125" y="269" text-anchor="middle" style="font-size:12.5px">Unit</text><text class="st" x="125" y="284" text-anchor="middle">test-driven development</text>
<g class="bx-new"><rect x="250" y="246" width="470" height="50" rx="8"/></g><text class="st" x="266" y="276" style="fill:var(--fz-fg);font-size:11.5px">a failing test at the seam the spec agreed</text>
<text class="t" x="740" y="276" style="font-size:12px">/tdd · /implement</text>
<path class="ar" d="M125,235 V244" marker-end="url(#ah)"/>
<g class="bx-exists"><rect x="20" y="308" width="210" height="50" rx="8"/></g><text class="t" x="125" y="331" text-anchor="middle" style="font-size:12.5px">Experiment</text><text class="st" x="125" y="346" text-anchor="middle">pre-registration</text>
<g class="bx-new"><rect x="250" y="308" width="470" height="50" rx="8"/></g><text class="st" x="266" y="338" style="fill:var(--fz-fg);font-size:11.5px">the predicate and its baseline, fixed before the run</text>
<text class="t" x="740" y="338" style="font-size:12px">/implement</text>
<path class="ar" d="M125,297 V306" marker-end="url(#ah)"/>
<text class="st" x="20" y="384">Teal: the check each skill commits to first, which later proves the work done. Each altitude is upstream of the one below: you cannot spec what you cannot name.</text>
</svg>
